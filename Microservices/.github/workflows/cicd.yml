name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'Microservices/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Microservices/**'
  workflow_dispatch:

jobs:
  test:
    name: Python Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f Microservices/code_runner/requirements.txt ]; then pip install -r Microservices/code_runner/requirements.txt; fi
      - name: Run Tests
        run: |
          # Placeholder for python tests
          echo "Running tests..."

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Microservices/code_runner
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Pull and Run Staging Container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:${{ github.sha }}
          docker stop coderunner-staging || true
          docker rm coderunner-staging || true
          docker run -d \
            --name coderunner-staging \
            -p 5001:5000 \
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: self-hosted
    environment: production
    steps:
      - name: Pull and Run Production Container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:${{ github.sha }}
          docker stop coderunner-production || true
          docker rm coderunner-production || true
          docker run -d \
            --name coderunner-production \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-coderunner:${{ github.sha }}
