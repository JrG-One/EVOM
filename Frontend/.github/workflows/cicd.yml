name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Linting & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: ./Frontend
      - name: Run Lint
        run: npm run lint || echo "Linting failed but continuing..."
        working-directory: ./Frontend

  build:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Pull and Run Staging Container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:${{ github.sha }}
          docker stop frontend-staging || true
          docker rm frontend-staging || true
          docker run -d \
            --name frontend-staging \
            -p 8081:80 \
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: self-hosted
    environment: production
    steps:
      - name: Pull and Run Production Container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:${{ github.sha }}
          docker stop frontend-production || true
          docker rm frontend-production || true
          docker run -d \
            --name frontend-production \
            -p 8080:80 \
            ${{ secrets.DOCKER_USERNAME }}/interviewwhiz-frontend:${{ github.sha }}
